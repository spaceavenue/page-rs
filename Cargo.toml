[package]
name = "page-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
crossterm = { version = "0.29.0", default-features = false }
memchr = { version = "2.8.3", default-features = false }
memmap2 = { version = "0.9.11", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
